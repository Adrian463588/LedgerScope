name: LedgerScope Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, format, build, and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e:
    name: Cypress against Docker Compose stack
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Compose configuration
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose config --quiet

      - name: Start full stack
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose up -d --build

      - name: Prepare database
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose exec -T backend php artisan migrate:fresh --seed --force

      - name: Wait for frontend
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:5173/login

      - name: Run Cypress
        working-directory: frontend
        run: npm run test:e2e

      - name: Stop stack
        if: always()
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose down --volumes
